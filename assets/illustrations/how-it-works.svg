<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"
     aria-label="모기제로 계산 흐름도. 발생원 시설 16종 15,204곳과 행정동 면적, 주민등록 인구를 합쳐 구역 고유의 밀도위험 0에서 1을 만들고, 여기에 실시간 날씨로 만든 활동지수를 곱해 0에서 100점의 모기지수를 냅니다. 결과는 시민과 방역 담당자가 사용합니다. 계산에 쓰지 않은 방역민원과 실측 유충 데이터로 검증했습니다.">
  <title>모기제로는 이렇게 계산합니다</title>
  <style>
    .bg{fill:#ffffff}
    .bx{fill:#f6faf9;stroke:#d8e6e2;stroke-width:1.5}
    .bx2{fill:#e6f4f1;stroke:#9ecfc7;stroke-width:1.5}
    .bx3{fill:#fff7ed;stroke:#f0d3ac;stroke-width:1.5}
    /* 결과 카드 — 배경은 밝게, 테두리를 굵게 해서 강조한다(글자 대비 확보) */
    .bxr{fill:#d3efe9;stroke:#0f766e;stroke-width:2.5}
    .bt{font:700 13.5px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#1f3b36}
    .bs{font:600 11px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#6b7b76}
    .bt-r{font:800 14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0b4f48}
    .bs-r{font:700 11.5px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#2c6f66}
    .ar{stroke:#9ab5af;stroke-width:2;fill:none}
    .vf{fill:#f4f9f8;stroke:#d5e7e3;stroke-width:1.5}
    .vt{font:700 13px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#1f3b36}
    .vs{font:600 12px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#5b6b68}
    .vn{font-weight:800;fill:#0f766e}
    .hd{font:700 13px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#9aa7a3}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ab5af"/></marker></defs>
  <rect class="bg" x="0" y="0" width="760" height="360" rx="14"/>
  <text x="24" y="34" class="hd">행정 데이터 + 실시간 날씨 → 구역별 모기지수</text>
  <rect x="24" y="58" width="168" height="52" rx="11" class="bx"/><text x="108.0" y="80.0" class="bt" text-anchor="middle">발생원 시설</text><text x="108.0" y="98.0" class="bs" text-anchor="middle">16종 · 15,204곳</text><path d="M 192 84 H 214" class="ar"/><rect x="24" y="124" width="168" height="52" rx="11" class="bx"/><text x="108.0" y="146.0" class="bt" text-anchor="middle">행정동 경계</text><text x="108.0" y="164.0" class="bs" text-anchor="middle">면적 km²</text><path d="M 192 150 H 214" class="ar"/><rect x="24" y="190" width="168" height="52" rx="11" class="bx"/><text x="108.0" y="212.0" class="bt" text-anchor="middle">주민등록 인구</text><text x="108.0" y="230.0" class="bs" text-anchor="middle">명</text><path d="M 192 216 H 214" class="ar"/><path d="M 214 84 V 216" class="ar"/><line x1="214" y1="150" x2="238" y2="150" class="ar" marker-end="url(#ah)"/><rect x="238" y="124" width="150" height="52" rx="11" class="bx2"/><text x="313.0" y="146.0" class="bt" text-anchor="middle">밀도위험</text><text x="313.0" y="164.0" class="bs" text-anchor="middle">0~1 · 구역 고유</text><line x1="392" y1="150" x2="426" y2="150" class="ar" marker-end="url(#ah)"/><rect x="426" y="58" width="150" height="52" rx="11" class="bx"/><text x="501.0" y="80.0" class="bt" text-anchor="middle">실시간 날씨</text><text x="501.0" y="98.0" class="bs" text-anchor="middle">기온·습도·강수·바람</text><line x1="501" y1="112" x2="501" y2="122" class="ar" marker-end="url(#ah)"/><rect x="426" y="124" width="150" height="52" rx="11" class="bx2"/><text x="501.0" y="146.0" class="bt" text-anchor="middle">활동지수</text><text x="501.0" y="164.0" class="bs" text-anchor="middle">× 날씨 보정</text><line x1="580" y1="150" x2="612" y2="150" class="ar" marker-end="url(#ah)"/><rect x="612" y="116" width="124" height="68" rx="11" class="bxr"/><text x="674.0" y="146.0" class="bt-r" text-anchor="middle">모기지수</text><text x="674.0" y="164.0" class="bs-r" text-anchor="middle">0~100점</text><line x1="674" y1="188" x2="674" y2="212" class="ar" marker-end="url(#ah)"/><rect x="578" y="212" width="162" height="46" rx="11" class="bx3"/><text x="659.0" y="231.0" class="bt" text-anchor="middle">시민 · 방역 담당자</text><text x="659.0" y="249.0" class="bs" text-anchor="middle">구역별 예보 · 우선순위</text><rect x="24" y="276" width="536" height="60" rx="11" class="vf"/><text x="40" y="298" class="vt">검증 — 계산에 쓰지 않은 실제 데이터와 대조</text><text x="40" y="320" class="vs">2025년 방역민원 밀도와 순위상관 <tspan class="vn">+0.951</tspan>   ·   실측 유충 월별 추이와 <tspan class="vn">+0.996</tspan></text>
</svg>