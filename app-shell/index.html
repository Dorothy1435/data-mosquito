<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모기제로</title>
  <!-- 안드로이드 앱 안에서 사이트를 열지 못했을 때(인터넷 끊김 등) 보여 주는 화면.
       앱은 평소에 실제 사이트(capacitor.config.json 의 server.url)를 연다. -->
  <link rel="stylesheet" href="offline.css">
</head>
<body>

    <img src="logo-icon.png" alt="모기제로 로고">

    <p>모기지수는 실시간 날씨로 계산해서 인터넷이 필요해요.<br>와이파이나 데이터를 켠 뒤 다시 시도해 주세요.</p>
    <button type="button" id="retryButton">다시 시도</button>
  </main>
  <script src="offline.js"></script>
